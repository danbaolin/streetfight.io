<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>馬來西亞篇關卡預覽</title>
<style>body{max-width:980px;margin:4vw auto;padding:0 16px;background:#172630;color:#faf2df;font:18px system-ui}canvas{width:100%;image-rendering:pixelated}input[type=range]{width:100%}select{font:inherit}label{display:block;margin:1em 0}</style><h1>馬來西亞篇</h1><label>選擇關卡 <select><option value="01">吉隆坡・雙峰塔</option><option value="02">吉隆坡・中央市場</option><option value="03">檳城・喬治市</option><option value="04">馬六甲・紅屋廣場</option><option value="05">怡保・舊街場</option><option value="06">亞庇・海濱</option></select></label><canvas width="640" height="360"></canvas><label>鏡頭位置<input type="range" min="0" max="1000" value="500"></label><label><input type="checkbox" checked> 顯示本關三名敵人</label><p id="msg"></p><script>
const ctx=document.querySelector('canvas').getContext('2d'),select=document.querySelector('select'),camera=document.querySelector('[type=range]'),show=document.querySelector('[type=checkbox]');
let assets,version=0;
function draw(){if(!assets)return;const [bg,...crew]=assets;const x=Math.round((bg.width-640)*camera.value/1000);ctx.drawImage(bg,-x,0);if(show.checked)crew.forEach((img,i)=>ctx.drawImage(img,[110,318,530][i]-64,[278,290,301][i]-122));}
async function load(){const current=++version;try{const next=await Promise.all(['stage','scout','guard','boss'].map(async n=>{const img=new Image();img.src=select.value+'/'+n+'.png';await img.decode();return img}));if(current!==version)return;assets=next;camera.value=500;draw();document.querySelector('#msg').textContent='';}catch{if(current===version)document.querySelector('#msg').textContent='請先將整個資料夾解壓縮。';}}
select.onchange=load;show.onchange=camera.oninput=draw;load();
</script></html>
